# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: ensure gradle wrapper exists and make it executable
        run: |
          if [ -f "$GITHUB_WORKSPACE/gradlew" ]; then
            echo "Found gradlew in repository root — making executable"
            chmod +x "$GITHUB_WORKSPACE/gradlew"
          else
            echo "::error::gradlew not found in repository root ($GITHUB_WORKSPACE). Listing repo contents for debugging:"
            ls -la "$GITHUB_WORKSPACE"
            echo "If your project uses the wrapper in a subdirectory, set 'working-directory:' on the steps that run gradle, or update this workflow to point to the subproject path."
            exit 1
          fi
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
