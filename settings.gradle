pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
        exclusiveContent {
            forRepository {
                maven { url = 'https://cursemaven.com' }
            }
            filter {
                includeGroup 'curse.maven'
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

rootProject.name = 'faeryrealm'
